[project]
name = "seamfix"
version = "0.1.0"
description = "Repair the joins of a repeat tile for print, and nothing else"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1",
    "pillow>=11",
    "scipy>=1.14",
    "pydantic>=2.9",
    "google-genai>=1.50",
    "langgraph>=1.1",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.12",
    "torch>=2.5",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["seamfix"]
[tool.ruff.lint.per-file-ignores]
"seamfix/server.py" = ["B008"]  # FastAPI's File() and Form() defaults
